<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 4</title>
  <style>
    .gallery {
      width: 400px;
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
      background-color: #f9f9f9;
    }
    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      margin-bottom: 10px;
      border: 1px solid #aaa;
    }
    .controls button {
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
      margin: 0 5px;
    }
  </style>
</head>
<body>

  <a href="../index.html">На головну сторінку</a>
  <hr>

  <h1>Завдання 4</h1>

  <div class="gallery">
    <img id="slideshow-img" src="" alt="Зображення">
    
    <div class="controls">
      <button id="btn-prev">Назад</button>
      <button id="btn-next">Вперед</button>
    </div>
  </div>

  <script>
    const jsonImagesData = '["file1.jpg", "file2.jpg", "file3.jpg", "file4.jpg"]';

    const images = JSON.parse(jsonImagesData);

    let currentIndex = 0;

    const imgElement = document.getElementById('slideshow-img');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');

    function updateImage() {
      imgElement.src = images[currentIndex];
    }

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateImage();
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateImage();
    });

    updateImage();
  </script>

</body>
</html>
