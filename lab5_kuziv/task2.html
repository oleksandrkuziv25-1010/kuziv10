<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 5 — Валідація форми</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f6f9;
        }

        .form-container {
            max-width: 600px;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border: 2px solid #ccc;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s, color 0.3s;
        }

        .valid-input {
            border-color: #28a745 !important;
            color: #212529 !important;
        }

        .status-icon {
            font-size: 18px;
            font-weight: bold;
            color: #28a745;
            min-width: 20px;
        }

        .invalid-input {
            border-color: #dc3545 !important;
            color: #dc3545 !important;
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            font-weight: bold;
            flex: 1;
        }

        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <a href="../index.html">На головну сторінку</a>
  <hr>

<div class="form-container">
    <h2>Форма реєстрації</h2>

    <form id="registrationForm" novalidate>
        <div class="form-group">
            <label for="email">E-mail:</label>
            <div class="input-row">
                <input type="email" id="email" placeholder="example@cnu.edu.ua">
                <span id="email-status"></span>
            </div>
        </div>

        <div class="form-group">
            <label for="fullname">Ім’я та прізвище:</label>
            <div class="input-row">
                <input type="text" id="fullname" placeholder="Іван ІВАНОВ">
                <span id="fullname-status"></span>
            </div>
        </div>

        <div class="form-group">
            <label for="login">Логін:</label>
            <div class="input-row">
                <input type="text" id="login" placeholder="userlogin">
                <span id="login-status"></span>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Пароль:</label>
            <div class="input-row">
                <input type="password" id="password" placeholder="Мінімум 8 символів">
                <span id="password-status"></span>
            </div>
        </div>

        <div class="form-group">
            <label for="zipcode">Поштовий індекс:</label>
            <div class="input-row">
                <input type="text" id="zipcode" placeholder="76000">
                <span id="zipcode-status"></span>
            </div>
        </div>

        <button type="button" onclick="validateForm()">Перевірити форму</button>
    </form>
</div>

<script>
    function validateForm() {
        const fields = [
            {
                id: 'email',
                regex: /^[a-zA-Z0-9._%+-]+@cnu\.edu\.ua$/i,
                errorText: 'Поштова адреса повинна містити @ та закінчуватися на cnu.edu.ua'
            },
            {
                id: 'fullname',
                regex: /^[A-ZА-ЯІЇЄҐ][a-zа-яіїєґ']+\s+[A-ZА-ЯІЇЄҐ]+$/,
                errorText: 'Перше слово з великої (решта маленькі), друге слово — ВСІ ВЕЛИКІ (напр. Тарас ШЕВЧЕНКО)'
            },
            {
                id: 'login',
                regex: /^[a-zA-Z]+$/,
                errorText: 'Логін повинен містити тільки латинські літери'
            },
            {
                id: 'password',
                regex: /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[_\-!@#$%^&*])[a-zA-Z\d_\-!@#$%^&*]{8,}$/,
                errorText: 'Мін. 8 символів: принаймні 1 буква, 1 цифра та 1 спецсимвол (_-!@#$%^&*)'
            },
            {
                id: 'zipcode',
                regex: /^\d{5}$/,
                errorText: 'Індекс повинен складатися точно з 5 цифр'
            }
        ];

        fields.forEach(field => {
            const inputElem = document.getElementById(field.id);
            const statusElem = document.getElementById(field.id + '-status');
            const value = inputElem.value.trim();

            if (field.regex.test(value)) {
                inputElem.className = 'valid-input';
                statusElem.className = 'status-icon';
                statusElem.innerHTML = '&#10004;';
            } else {
                inputElem.className = 'invalid-input';
                statusElem.className = 'error-message';
                statusElem.innerText = field.errorText;
            }
        });
    }
</script>

</body>
</html>
