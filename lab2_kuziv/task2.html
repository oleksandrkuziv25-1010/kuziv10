<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2 — Калькулятор</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        .calculator {
            width: 220px;
            padding: 15px;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .calc-display {
            width: 100%;
            height: 35px;
            font-size: 18px;
            text-align: right;
            margin-bottom: 10px;
            box-sizing: border-box;
            padding: 5px;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .calc-buttons button {
            height: 40px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <p><a href="../index.html">На головну сторінку</a></p>
    <hr>

    <h2>Завдання 2 — Простий калькулятор</h2>

    <div class="calculator">
        <input type="text" id="display" class="calc-display" readonly>
        <div class="calc-buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendSymbol('/')">/</button>
            <button onclick="appendSymbol('*')">*</button>
            <button onclick="appendSymbol('-')">-</button>

            <button onclick="appendSymbol('7')">7</button>
            <button onclick="appendSymbol('8')">8</button>
            <button onclick="appendSymbol('9')">9</button>
            <button onclick="appendSymbol('+')">+</button>

            <button onclick="appendSymbol('4')">4</button>
            <button onclick="appendSymbol('5')">5</button>
            <button onclick="appendSymbol('6')">6</button>
            <button onclick="calculate()" style="grid-row: span 2; height: 85px;">=</button>

            <button onclick="appendSymbol('1')">1</button>
            <button onclick="appendSymbol('2')">2</button>
            <button onclick="appendSymbol('3')">3</button>

            <button onclick="appendSymbol('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendSymbol('.')">.</button>
        </div>
    </div>

    <script>
        function appendSymbol(symbol) {
            document.getElementById('display').value += symbol;
        }

        function clearDisplay() {
            document.getElementById('display').value = '';
        }

        function calculate() {
            let display = document.getElementById('display');
            try {
                if (display.value !== '') {
                    display.value = eval(display.value);
                }
            } catch (error) {
                display.value = 'Помилка';
                setTimeout(clearDisplay, 1500);
            }
        }
    </script>
</body>
</html>
