<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1 - Варіант 5</title>
</head>
<body onLoad="clock()">
    <p><a href="../index.html">На головну сторінку</a></p>
    <hr>
    <h2>Завдання 1</h2>
    <p>Формат: <b>hour$min$sec-year$moun$day</b></p>

    <form name="clockForm">
        <label for="dateTime">Годинник / Календар:</label><br>
        <input type="text" name="dateTime" id="dateTime" size="35" value="" readonly>
    </form>

    <script>
        function clock() {
            let now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            let year = now.getFullYear(); 
            let month = now.getMonth() + 1; 
            let day = now.getDate();

            let hStr = (hours < 10 ? "0" : "") + hours;
            let minStr = (minutes < 10 ? "0" : "") + minutes;
            let secStr = (seconds < 10 ? "0" : "") + seconds;
            
            let mounStr = (month < 10 ? "0" : "") + month;
            let dayStr = (day < 10 ? "0" : "") + day;

            let fullString = hStr + ":" + minStr + ":" + secStr + "-" + year + "." + mounStr + "." + dayStr;

            document.clockForm.dateTime.value = fullString;

            setTimeout("clock()", 1000);
        }
    </script>
</body>
</html>
